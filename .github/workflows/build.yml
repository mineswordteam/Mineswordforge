name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run dist -- --publish never

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-${{ github.run_number }}" release/*.exe --title "MineSword Forge Windows ${{ github.run_number }}" --notes "MineSword Forge Windows installers — x64 and ia32"
